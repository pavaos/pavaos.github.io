	<script>
(function () {

    const MIN_LABEL_ZOOM = 8;

    // Przejdź przez wszystkie warstwy, również w grupach
    function getVectorLayers(collection) {
        let result = [];

        collection.forEach(function(layer) {
            if (layer instanceof ol.layer.Group) {
                result = result.concat(
                    getVectorLayers(layer.getLayers())
                );
            } else if (layer instanceof ol.layer.Vector) {
                result.push(layer);
            }
        });

        return result;
    }

    // Zmień funkcje stylów warstw
    function setupLabelVisibility() {

        const layers = getVectorLayers(map.getLayers());

        layers.forEach(function(layer) {

            const originalStyle = layer.getStyleFunction();

            if (!originalStyle) return;

            layer.setStyle(function(feature, resolution) {

                const styles = originalStyle(feature, resolution);

                if (!styles) return styles;

                // Zachowaj oryginalne style
                const styleArray = Array.isArray(styles)
                    ? styles
                    : [styles];

                // Gdy zoom jest wystarczający,
                // używaj oryginalnych stylów
                if (map.getView().getZoom() >= MIN_LABEL_ZOOM) {
                    return styles;
                }

                // Przy mniejszym zoomie usuń wyłącznie etykiety
                return styleArray.map(function(style) {

                    const copy = style.clone();
                    copy.setText(null);

                    return copy;
                });
            });

        });
    }

    setupLabelVisibility();

})();
</script>

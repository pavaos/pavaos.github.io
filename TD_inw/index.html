<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Przeszukiwarka inwentarzy</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#17212e;background:#f4f6f9}*{box-sizing:border-box}body{margin:0;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:1.5rem;margin:0}p{margin:8px 0 16px;color:#526072}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}button{border:1px solid #b8c3d1;border-radius:7px;padding:9px 13px;background:white;cursor:pointer;font-weight:600}button:hover{background:#e8eef6}label{display:flex;gap:6px;align-items:center}#status{font-weight:600}main{border:1px solid #d5dce6;border-radius:10px;background:white;overflow:auto;max-height:75vh}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1250px;font-size:13px}th,td{border-bottom:1px solid #e5e9f0;border-right:1px solid #edf0f4;padding:8px 10px;text-align:left;vertical-align:top}thead th{position:sticky;top:0;background:#eaf0f8;z-index:2;white-space:nowrap}thead tr.filters th{top:35px;background:#f7f9fc}th input{width:100%;min-width:80px;padding:7px;border:1px solid #b9c5d3;border-radius:5px;font:inherit}th input.invalid{border:2px solid #c62828;background:#fff2f2}tbody tr:nth-child(even){background:#fafbfd}tbody tr:hover{background:#edf5ff}th.sort{cursor:pointer}th.sort:hover{background:#dce7f5}td{white-space:pre-wrap}#message{color:#b42318;font-size:13px}.hint{font-size:12px;color:#5a6575} .empty{text-align:center;padding:25px} .footer{margin-top:10px;color:#526072;font-size:12px}
</style></head><body>
<header><h1>Przeszukiwarka inwentarzy</h1><span id="status">Wczytywanie danych…</span></header>
<p>Wpisz fragment tekstu w dowolnych kolumnach. Wszystkie aktywne warunki muszą być spełnione. Kliknij nagłówek kolumny, aby sortować.</p>
<div class="controls"><label><input type="checkbox" id="regex"> Wyrażenia regularne (regex)</label><label><input type="checkbox" id="case"> Rozróżniaj wielkość liter</label><button id="clear">Wyczyść filtry</button><button id="export">Eksport wyników do CSV</button><span id="message"></span></div>
<main><table><thead><tr id="head"></tr><tr id="filters" class="filters"></tr></thead><tbody id="body"></tbody></table></main>
<div class="footer">Dane ładowane lokalnie z pliku dane.js. Po aktualizacji pliku odśwież stronę (Ctrl+F5). <span id="displayInfo"></span></div>
<script src="dane.js"></script>
<script>
(()=>{
const headers=window.KSIEGI_HEADERS||[], data=window.KSIEGI_DATA||[];
const $=id=>document.getElementById(id), head=$('head'), filters=$('filters'), body=$('body');
let sortColumn=-1, sortDirection=1, shown=[];
if(!headers.length){$('status').textContent='Brak danych';$('message').textContent='Nie udało się wczytać dane.js. Sprawdź, czy jest obok index.html.';return;}
const inputs=[];
headers.forEach((h,i)=>{
 const th=document.createElement('th');th.textContent=h;th.className='sort';th.title='Sortuj według tej kolumny';th.addEventListener('click',()=>{if(sortColumn===i)sortDirection*=-1;else{sortColumn=i;sortDirection=1;}update()});head.append(th);
 const fth=document.createElement('th'),inp=document.createElement('input');inp.placeholder='Filtr…';inp.setAttribute('aria-label','Filtr '+h);inp.addEventListener('input',update);fth.append(inp);filters.append(fth);inputs.push(inp);
});
$('regex').addEventListener('change',update);$('case').addEventListener('change',update);
$('clear').addEventListener('click',()=>{inputs.forEach(i=>i.value='');$('regex').checked=false;$('case').checked=false;sortColumn=-1;sortDirection=1;update()});
$('export').addEventListener('click',()=>{
 const esc=s=>'"'+String(s??'').replaceAll('"','""')+'"';
 const content='\uFEFF'+[headers,...shown].map(r=>r.map(esc).join(';')).join('\r\n');
 const blob=new Blob([content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='wyniki_inwentarze.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
function update(){
 const regex=$('regex').checked, sensitive=$('case').checked, flags=sensitive?'':'i';let tests=[],error='';
 inputs.forEach((inp,i)=>{inp.classList.remove('invalid');const q=inp.value;if(!q)return;
 if(regex){try{const re=new RegExp(q,flags);tests.push(row=>re.test(String(row[i]??'')))}catch(e){inp.classList.add('invalid');error=`Błędny regex w kolumnie „${headers[i]}”: ${e.message}`}}
 else{const needle=sensitive?q:q.toLocaleLowerCase('pl');tests.push(row=>{const value=String(row[i]??'');return (sensitive?value:value.toLocaleLowerCase('pl')).includes(needle)})}
 });
 $('message').textContent=error;
 shown=error?[]:data.filter(row=>tests.every(fn=>fn(row)));
 if(sortColumn>=0){shown.sort((a,b)=>sortDirection*String(a[sortColumn]??'').localeCompare(String(b[sortColumn]??''),'pl',{numeric:true,sensitivity:sensitive?'variant':'base'}))}
 body.replaceChildren();const frag=document.createDocumentFragment();
 // Ograniczenie liczby jednocześnie renderowanych wierszy chroni płynność przeglądarki.
 const limit=1500;
 shown.slice(0,limit).forEach(row=>{const tr=document.createElement('tr');headers.forEach((_,i)=>{const td=document.createElement('td');td.textContent=row[i]??'';tr.append(td)});frag.append(tr)});
 if(!shown.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=headers.length;td.className='empty';td.textContent=error?'Popraw wyrażenie regularne.':'Brak pasujących rekordów';tr.append(td);frag.append(tr)}
 body.append(frag);$('status').textContent=`Wyniki: ${shown.length.toLocaleString('pl-PL')} / ${data.length.toLocaleString('pl-PL')}`;
 $('displayInfo').textContent=shown.length>limit?`Wyświetlono pierwsze ${limit} rekordów; eksport CSV obejmuje wszystkie ${shown.length}.`:'';
}
update();
})();
</script></body></html>
